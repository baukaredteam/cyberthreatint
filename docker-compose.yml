version: '3.8'

services:
  phishing-monitor:
    build: .
    container_name: phishing-monitor
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CERTSTREAM_URL=wss://certstream.calidog.io
      - DATABASE_PATH=/app/data/phishing.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CLIENT_DOMAINS=${CLIENT_DOMAINS:-qazpost.kz,example.com}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-60}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.8}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - phishing-monitor-network

  misp-bot:
    build:
      context: .
      dockerfile: cmd/misp-bot/Dockerfile
    container_name: misp-soc-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
      - MISP_BASE_URL=${MISP_BASE_URL}
      - MISP_API_KEY=${MISP_API_KEY}
      - MISP_SKIP_TLS_VERIFY=${MISP_SKIP_TLS_VERIFY:-true}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - phishing-monitor-network
    depends_on: []

networks:
  phishing-monitor-network:
    driver: bridge

volumes:
  phishing-data:
    driver: local